name: "CodeQL Security Analysis (Private Repo)"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
    # Versión exacta de checkout
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    # Versión exacta de setup-java
    - name: Set up JDK
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '25'
        distribution: 'liberica'

    # Versión exacta del ecosistema de CodeQL (v3 estable)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3.25.15
      with:
        languages: 'java'
        queries: security-extended 

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3.25.15

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3.25.15
      with:
        category: "/language:java"
        upload: false

    # Versión exacta de upload-artifact
    - name: Upload CodeQL Results as Artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: codeql-results-java
        path: /home/runner/work/portfolio-backend/results/java.sarif
        retention-days: 7
