name: "CodeQL Security Analysis (Private Repo)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # Eliminamos 'security-events: write' porque GitHub nos lo rechaza en privado

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'liberica'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'java'
        queries: security-extended 

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # Ejecutamos el análisis, pero le decimos que NO intente subirlo a GitHub
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"
        upload: false # <--- CRUCIAL: Evita el error de permisos de GitHub

    # PASO NUEVO: Guardamos el reporte SARIF (JSON de seguridad) como un artefacto descargable
    - name: Upload CodeQL Results as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results-java
        path: /home/runner/work/portfolio-backend/results/java.sarif
        retention-days: 7
