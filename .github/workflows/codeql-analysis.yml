name: "CodeQL Security Analysis (Private Repo)"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: 'maven' # Esto asegura que use tu caché local de dependencias

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3.28.10
      with:
        languages: 'java'
        queries: security-extended 

    # SOLUCIÓN RADICAL: Usamos el comando nativo "mvn" del sistema operativo.
    # Al ser un binario nativo, CodeQL lo intercepta al 100% sin perder el proceso.
    # Como ya configuramos la caché arriba, NO descargará internet de nuevo.
    - name: Custom Build for CodeQL
      run: mvn clean compile -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3.28.10
      with:
        category: "/language:java"
        upload: false

    - name: Upload CodeQL Results as Artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: codeql-results-java
        path: /home/runner/work/portfolio-backend/results/java.sarif
        retention-days: 7
