spring:
  application:
    name: portfolio-backend
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
 
    hikari:         # Par obligatorio de provider_disables_autocommit
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE}        # ~5-10MB por conexión; ajusta según plan Railway
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: 300000
      max-lifetime: 1200000 
 
  jpa:
    open-in-view: false           # Evita N+1 silenciosas y retención de conexiones del pool
    hibernate:
      ddl-auto: none              # Migraciones con Flyway/Liquibase, nunca 'update' en prod
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        # --- Batching ---
        # Funciona con Session estándar que usa Spring Data JPA por debajo
        jdbc:
          batch_size: 20
          batch_versioned_data: true
          order_inserts: true
          order_updates: true

        # --- Gestión de conexiones ---
        connection:
          provider_disables_autocommit: true
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

        # --- SQL en producción ---
        format_sql: false
        use_sql_comments: false

        # --- Caché desactivada (RAM limitada en Railway) ---
        cache:
          use_second_level_cache: false
          use_query_cache: false

  sql:
    init:
      mode: never
  jackson:
    # --- Fechas ---
    # NOTA Jackson 3: write-dates-as-timestamps ya es FALSE por defecto.
    # Solo lo declaramos explícitamente como documentación defensiva.
    # La propiedad ahora vive bajo 'datatype.datetime', NO bajo 'serialization'.
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-durations-as-timestamps: false

    # UTC global: Railway y local siempre alineados
    time-zone: UTC

    # Formato con milisegundos y zona explícita (ej: 2026-06-06T23:58:00.000Z)
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

    # --- Tamaño del JSON (memoria y red) ---
    # Omite campos null en todas las respuestas
    default-property-inclusion: non_null

    # --- Resiliencia en deserialización ---
    deserialization:
      fail-on-unknown-properties: false   # No rompe si llegan campos nuevos
      fail-on-ignored-properties: false
      
server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:4}
      min-spare: 2
    max-connections:  ${SERVER_TOMCAT_MAX_CONNECTIONS:2000}
    accept-count: 100
app:
  async:
   timeout: 5000