name: "CodeQL Security Analysis (Private Repo)"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: 'maven' # Añadimos caché para que las dependencias se descarguen más rápido

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3.25.15
      with:
        languages: 'java'
        queries: security-extended 

    # PASO NUEVO 1: Darle permisos de ejecución al wrapper de Maven
    - name: Grant execute permission for mvnw
      run: chmod +x id_or_path_to_mvnw ./mvnw

    # PASO NUEVO 2: Reemplazo manual de Autobuild
    # Compilamos el proyecto saltándonos los tests para ir directos al análisis
    - name: Custom Build for CodeQL
      run: ./mvnw clean compile -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3.25.15
      with:
        category: "/language:java"
        upload: false

    - name: Upload CodeQL Results as Artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: codeql-results-java
        path: /home/runner/work/portfolio-backend/results/java.sarif
        retention-days: 7
