name: "CodeQL Security Analysis (Private Repo)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
    # actions/checkout@v4.2.2
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    # actions/setup-java@v4.7.0
    - name: Set up JDK
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
      with:
        java-version: '25'
        distribution: 'liberica'

    # github/codeql-action/init@v3.25.15 (SHA verificado)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@4fa2a795b3401d4b1121803367f88102ff5765d8
      with:
        languages: 'java'
        queries: security-extended 

    # github/codeql-action/autobuild@v3.25.15 (SHA verificado)
    - name: Autobuild
      uses: github/codeql-action/autobuild@4fa2a795b3401d4b1121803367f88102ff5765d8

    # github/codeql-action/analyze@v3.25.15 (SHA verificado)
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@4fa2a795b3401d4b1121803367f88102ff5765d8
      with:
        category: "/language:java"
        upload: false

    # actions/upload-artifact@v4.6.1
    - name: Upload CodeQL Results as Artifact
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
      with:
        name: codeql-results-java
        path: /home/runner/work/portfolio-backend/results/java.sarif
        retention-days: 7
