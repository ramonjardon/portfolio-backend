name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
            java-version: '25'
            distribution: 'liberica'
            cache: 'maven'
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
 # 🚀 PASO UNIFICADO: Compila, ejecuta JaCoCo y manda los datos a SonarCloud
      - name: Build and analyze
        env:
          # Inyectamos el GITHUB_TOKEN (lo da GitHub solo) y tu SONAR_TOKEN secreto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Usamos tu ./mvnw para asegurar compatibilidad de tu arquitectura hexagonal
        run: |
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=https://sonarcloud.io

      # 📊 PASO EXTRA: Sube el mismo reporte de cobertura generado a Codecov
# 📊 PASO EXTRA: Sube el mismo reporte de cobertura generado a Codecov
# 📊 PASO EXTRA: Sube el reporte de cobertura generado a Codecov
# 📊 PASO EXTRA: Sube el reporte de cobertura generado a Codecov (v7 con Attestation)
      - name: Upload coverage reports to Codecov
        # 🛡️ SHA inmutable de la v7.0.0 verificado por el attestation de Sigstore
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./**/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
