spring:
  application:
    name: portfolio-backend
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:        # Par obligatorio de provider_disables_autocommit
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE}        # ~5-10MB por conexión; ajusta según plan Railway
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: 300000
      max-lifetime: 1200000
      

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        # --- Ordenación de lotes ---
        order_inserts: true
        order_updates: true

        # --- Zona horaria ---
        timezone:
          default_storage: NORMALIZE_UTC

        # --- JDBC ---
        jdbc:
          batch_size: 20
          batch_versioned_data: true
          time_zone: UTC

        # --- Gestión de conexiones ---
        connection:
          provider_disables_autocommit: true
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

        # --- SQL en producción ---
        format_sql: false
        use_sql_comments: false
        generate_statistics: false

        # --- Query Plan Cache ---
        query:
          plan_cache_max_size: 32
          plan_parameter_metadata_max_size: 16

        # --- Caché ---
        cache:
          use_second_level_cache: false
          use_query_cache: false

        # --- Validación ---
        jakarta:
          validation:
            mode: none
  sql:
    init:
      mode: never
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-durations-as-timestamps: false
        write-date-timestamps-as-nanoseconds: false
        read-date-timestamps-as-nanoseconds: false
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    deserialization:
      fail-on-unknown-properties: false
      
server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:4}
      min-spare: 2
    max-connections:  ${SERVER_TOMCAT_MAX_CONNECTIONS:2000}
    accept-count: 100
app:
  async:
    timeout: 5000