name: "CodeQL Security Analysis (Private Repo)"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
    # Versión exacta de checkout
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    # Versión exacta de setup-java
    - name: Set up JDK
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: 'maven'

    # Versión moderna de 2026 para soportar Java 25 (Fijada exactamente)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3.28.10
      with:
        languages: 'java'
        queries: security-extended 

    - name: Grant execute permission for mvnw
      run: chmod +x ./mvnw

    # Compilación limpia con tu wrapper saltando el checksum conflictivo
    - name: Custom Build for CodeQL
      run: ./mvnw clean compile -DskipTests
      env:
        MVNW_SKIP_CHECKSUM: true

    # Versión moderna de análisis (Fijada exactamente)
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3.28.10
      with:
        category: "/language:java"
        upload: false

    # Versión exacta de upload-artifact
    - name: Upload CodeQL Results as Artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: codeql-results-java
        path: /home/runner/work/portfolio-backend/results/java.sarif
        retention-days: 7
